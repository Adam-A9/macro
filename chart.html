<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full History · Macro</title>
<script>
  try { var t = localStorage.getItem('macro.theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="stylesheet" href="css/site.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  html, body { height: 100%; }
  .detail { display: grid; grid-template-rows: auto minmax(360px, 1fr); gap: 20px; min-height: 100%; padding: 24px var(--gutter); }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;
                 border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .detail-head h1 { font-size: 24px; font-weight: 650; margin-top: 2px; }
  .detail-meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--ink-3); font-size: 13px; align-items: baseline; }
  .detail-value { color: var(--ink); font-size: 22px; font-weight: 650; }
  .detail-chart { position: relative; min-height: 0; }
  .detail-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
</style>
</head>
<body>
<main class="detail">
  <header class="detail-head">
    <div>
      <div class="module-asof" id="series-id">Loading</div>
      <h1 id="series-title">Economic chart</h1>
    </div>
    <div class="detail-meta">
      <span id="series-interval"></span>
      <span id="series-range"></span>
      <span class="detail-value" id="series-value"></span>
    </div>
  </header>
  <div class="detail-chart">
    <canvas id="history-chart" role="img" aria-label="Full history chart"></canvas>
    <div class="detail-state" id="chart-state">Loading all available observations…</div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/chart-detail.js"></script>
</body>
</html>
